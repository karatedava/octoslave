name: Build Installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 0.2.1) — leave blank to use git tag'
        required: false
        default: ''

jobs:
  # ── macOS (.dmg) ─────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pillow

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Resolve version
        id: version
        run: echo "version=$(python scripts/version.py)" >> "$GITHUB_OUTPUT"

      - name: Build .app and DMG
        # build_dmg.sh runs PyInstaller, codesign, and create-dmg in one pass.
        # --skip-pyinstaller is NOT passed here so PyInstaller runs inside the script.
        env:
          OTS_VERSION: ${{ steps.version.outputs.version }}
        run: bash installers/macos/build_dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctoSlave-macOS
          path: dist/OctoSlave-macOS-*.dmg

  # ── Windows (.exe installer) ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller pillow

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: version
        shell: bash
        run: echo "version=$(python scripts/version.py)" >> "$GITHUB_OUTPUT"

      - name: Build ots.exe (CLI binary)
        run: python -m PyInstaller --clean --noconfirm installers\windows\ots_cli.spec

      - name: Build OctoSlave-Setup.exe (first-run wizard)
        run: python -m PyInstaller --clean --noconfirm installers\windows\ots_wizard.spec

      - name: Build installer with Inno Setup
        shell: cmd
        env:
          OTS_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set "ISCC=C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if not exist "%ISCC%" set "ISCC=C:\Program Files\Inno Setup 6\ISCC.exe"
          "%ISCC%" /DAppVersion=%OTS_VERSION% installers\windows\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctoSlave-Windows
          path: dist/OctoSlave-Windows-Installer-*.exe

  # ── Linux (.AppImage) ────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tk-dev python3-tk
          # libfuse2 was renamed to libfuse2t64 in Ubuntu 24.04
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Download appimagetool
        run: |
          wget -q -O /tmp/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /tmp/appimagetool
          sudo mv /tmp/appimagetool /usr/local/bin/appimagetool

      - name: Resolve version
        id: version
        run: echo "version=$(python scripts/version.py)" >> "$GITHUB_OUTPUT"

      - name: Build AppImage
        env:
          OTS_VERSION: ${{ steps.version.outputs.version }}
        run: bash installers/linux/build_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: OctoSlave-Linux
          path: dist/OctoSlave-*-x86_64.AppImage

  # ── Verify tag matches pyproject version (tag pushes only) ───────────────
  verify-version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Git tag must match pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT="$(python scripts/version.py)"
          echo "git tag: ${GITHUB_REF_NAME} (-> ${TAG})   pyproject: ${PYPROJECT}"
          if [ "$TAG" != "$PYPROJECT" ]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match pyproject version '${PYPROJECT}'. Bump pyproject.toml to ${TAG} (or re-tag) so the version is unambiguous."
            exit 1
          fi

  # ── GitHub Release (tag pushes only) ─────────────────────────────────────
  release:
    needs: [verify-version, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/OctoSlave-macOS/*.dmg
            artifacts/OctoSlave-Windows/*.exe
            artifacts/OctoSlave-Linux/*.AppImage
          draft: true
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
