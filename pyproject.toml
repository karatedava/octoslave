[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "octoslave"
version = "3.2.0"
description = "Autonomous AI research & coding assistant — terminal + web UI, multi-agent parallel mode, e-INFRA CZ / NVIDIA NIM / Ollama backends"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "David Kopecky", email = "karatedava@seznam.cz" },
]
keywords = [
    "llm", "agent", "ai", "research", "coding-assistant",
    "autonomous", "ollama", "nvidia-nim", "e-infra",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    "prompt_toolkit>=3.0.0",
    "ddgs>=0.1.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
    "pymupdf>=1.23.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "psutil>=5.9.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://octoslave.karamazov.website"
Repository = "https://github.com/karatedava/octoslave"
Issues = "https://github.com/karatedava/octoslave/issues"

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
]
bio = [
    "rdkit>=2024.3.1",
    "anndata>=0.10.0",
    "scipy>=1.11.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
]
# CryoUncle — CryoSPARC companion (cryo-EM). Optional: the tools degrade
# gracefully with a "pip install cryosparc-tools" message when absent.
cryo = [
    "cryosparc-tools>=4.4.0",
    "numpy>=1.24.0",
]
all = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "rdkit>=2024.3.1",
    "anndata>=0.10.0",
    "scipy>=1.11.0",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "cryosparc-tools>=4.4.0",
]

[project.scripts]
octoslave = "octoslave.main:cli"
ots = "octoslave.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["octoslave*"]

[tool.setuptools.package-data]
octoslave = [
    "prompt_profiles/*.md",
    "web/static/*.html",
    "web/static/*.png",
    "web/static/css/*.css",
    "web/static/js/*.js",
    "web/lab_static/*.html",
    "web/lab_static/assets/*.js",
    "web/lab_static/assets/*.css",
]
